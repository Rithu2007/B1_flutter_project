[build]
  command = "bash scripts/netlify-build.sh"
  publish = "build/web"

[build.environment]
  FLUTTER_VERSION = "3.50.1"

# Always fetch the latest app shell so new deploys show up immediately
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache"

# Serve the Flutter app for any deep link
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
